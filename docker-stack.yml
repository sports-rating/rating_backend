version: "3.8"

services:
  web:
    image: userb1docker/sports-rating:${IMAGE_TAG}
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:15
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - backend
    deploy:
      restart_policy:
        condition: on-failure

  celery_beat:
    image: userb1docker/sports-rating:${IMAGE_TAG}
    env_file: .env
    command: celery -A core beat --loglevel=info
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  celery_worker:
    image: userb1docker/sports-rating:${IMAGE_TAG}
    env_file: .env
    command: celery -A core worker --loglevel=info
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7
    volumes:
      - /home/bekhruz/.redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      - backend
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis-data:

networks:
  backend:
    driver: overlay
