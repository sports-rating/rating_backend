receivers:
  otlp:
    protocols:
      grpc:
      http:

  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    poll_interval: 200ms
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      - id: container-parser
        type: container
        format: docker

exporters:
  clickhousetraces:
    dsn: tcp://clickhouse:9000?database=signoz_traces
  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000?database=signoz_metrics
  clickhouselogs:
    dsn: tcp://clickhouse:9000?database=signoz_logs

processors:
  batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [signozclickhousemetrics]
    logs:
      receivers: [otlp, filelog]
      processors: [batch]
      exporters: [clickhouselogs]
