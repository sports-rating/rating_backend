receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    poll_interval: 200ms
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      - id: container-parser
        type: container
        format: docker

processors:
  batch:

exporters:
  clickhousetraces:
    datasource: tcp://signoz:signoz_password_123@clickhouse:9000/signoz_traces
    use_new_schema: true

  signozclickhousemetrics:
    dsn: tcp://signoz:signoz_password_123@clickhouse:9000/signoz_metrics

  clickhouselogsexporter:
    dsn: tcp://signoz:signoz_password_123@clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true

  debug:
    verbosity: normal

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [signozclickhousemetrics]
    logs:
      receivers: [otlp, filelog]
      processors: [batch]
      exporters: [clickhouselogsexporter]
