repos:
  # Check JSON, YAML, TOML validity
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  # Custom hook — check if migrations are missing
  - repo: local
    hooks:
      - id: check-missing-migrations
        name: Check for missing migrations
        entry: bash -c 'python manage.py makemigrations --check --dry-run'
        language: system
        pass_filenames: false

  # Custom hook — check if migrations are unapplied
  - repo: local
    hooks:
      - id: check-unapplied-migrations
        name: Check for unapplied migrations
        entry: bash -c 'python manage.py showmigrations --plan | grep "\[ \]" && { echo "❌ Unapplied migrations found! Run python manage.py migrate"; exit 1; } || exit 0'
        language: system
        pass_filenames: false

  # Custom hook — check for unstaged changes
  - repo: local
    hooks:
      - id: check-unstaged-files
        name: Check for unstaged files
        entry: bash -c 'if ! git diff --quiet; then echo "❌ You have unstaged changes! Please stage or stash them before committing."; exit 1; fi'
        language: system
        pass_filenames: false
