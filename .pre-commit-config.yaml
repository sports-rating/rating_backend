  #     - id: black

  # isort for import sorting
  # - repo: https://github.com/PyCQA/isort
  #   rev: 5.12.0
  #   hooks:
  #     - id: isort

  # # Flake8 for linting
  # - repo: https://github.com/pycqa/flake8
  #   rev: 6.1.0
  #   hooks:
  #     - id: flake8

  # Check JSON, YAML, TOML validity
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  # Custom hook — check if migrations are missing
  - repo: local
    hooks:
      - id: check-missing-migrations
        name: Check for missing migrations
        entry: bash -c 'python manage.py makemigrations --check --dry-run'
        language: system
        pass_filenames: false

  # Custom hook — check if migrations are unapplied
  - repo: local
    hooks:
      - id: check-unapplied-migrations
        name: Check for unapplied migrations
        entry: bash -c 'python manage.py showmigrations --plan | grep "\[ \]" && { echo "❌ Unapplied migrations found! Run python manage.py migrate"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
