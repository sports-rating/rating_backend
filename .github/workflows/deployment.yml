name: Deploy

on:
  push:
    branches: [ main, dev ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    #   - name: Log in to GHCR
    #     # run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
    #     run: echo "${{ secrets.USERB_CI_PUSH_TOKEN_PAT }}" | docker login ghcr.io -u CoderB7 --password-stdin

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Set Image Name and Tags
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi
          echo "COMMIT_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "IMAGE_NAME=userb1docker/sports-rating" >> $GITHUB_ENV

        #   echo "IMAGE_NAME=ghcr.io/sports-rating/myapp" >> $GITHUB_ENV. # for GHCR

      - name: Build and Push Docker Image
        run: |
          docker build -f deployment/Dockerfile -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:$COMMIT_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:$COMMIT_TAG

      - name: Trigger Portainer Webhook
        run: |
          curl -X POST ${{ secrets.PORTAINER_WEBHOOK_URL }}
