services:
  website_blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8001:8000" # Blue on port 8001
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  website_green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8002:8000" # Green on port 8002
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  postgres:
    expose:
      - 5432
    image: postgres:latest
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - backend

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core worker --loglevel=info
    restart: unless-stopped
    volumes:
      - /var/www/media:/app/media
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  redis:
    expose:
      - 6379
    image: redis:latest
    volumes:
      - /home/mukhammad/backend/.redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: always
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - /mnt/minio-storage:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin_minio_12345
    command: server /data --console-address ":9001"
    networks:
      - backend

  mc:
    image: minio/mc
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin_minio_12345;
      tail -f /dev/null
      "

  signoz:
    image: signoz/signoz:latest
    container_name: signoz
    ports:
      - "3301:3301"
    depends_on:
      - clickhouse
    environment:
      - STORAGE=clickhouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_URL=tcp://clickhouse:9000
    networks:
      - backend

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - backend

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:latest
    container_name: signoz-otel-collector
    volumes:
      - ./signoz-config.yaml:/etc/otel/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4318:4318" # HTTP
    environment:
      - SIGNOZ_LOGS_BACKEND=clickhouse
    depends_on:
      - signoz
    networks:
      - backend

  fluent-bit:
    image: fluent/fluent-bit:2.1
    container_name: fluent-bit
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - signoz-otel-collector
    networks:
      - backend

volumes:
  postgres_data:
  redis-data:
  clickhouse_data:
    driver: local

networks:
  backend:
    driver: bridge
