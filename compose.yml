services:
  website_blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8001:8000" # Blue on port 8001
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  website_green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8002:8000" # Green on port 8002
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  postgres:
    expose:
      - 5432
    image: postgres:latest
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - backend

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core worker --loglevel=info
    restart: unless-stopped
    volumes:
      - /var/www/media:/app/media
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  redis:
    expose:
      - 6379
    image: redis:latest
    volumes:
      - /home/mukhammad/backend/.redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: always
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - /mnt/minio-storage:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin_minio_12345
    command: server /data --console-address ":9001"
    networks:
      - backend

  mc:
    image: minio/mc
    container_name: minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin_minio_12345;
      tail -f /dev/null
      "

  # ffmpeg:
  #   image: jrottenberg/ffmpeg:6.0-ubuntu
  #   container_name: ffmpeg
  #   restart: unless-stopped
  #   volumes:
  #     - /var/www/media:/app/media
  #   networks:
  #     - backend
  #   working_dir: /app/media
  #   entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
  redis-data:
  minio-data:

networks:
  backend:
    driver: bridge
