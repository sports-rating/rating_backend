services:
  website_blue:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8001:8000" # Blue on port 8001
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  website_green:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: ./deployment/start.sh
    volumes:
      - /var/www/static:/app/staticfiles
      - /var/www/media:/app/media
    ports:
    - "8002:8000" # Green on port 8002
    depends_on:
      - redis
      - postgres
    networks:
      - backend

  postgres:
    expose:
      - 5432
    image: postgres:latest
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - backend

  celery_beat:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core beat --loglevel=info
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  celery_worker:
    build:
      dockerfile: deployment/Dockerfile
      context: .
    env_file: .env
    command: celery -A core worker --loglevel=info
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis
      - postgres

  redis:
    expose:
      - 6379
    image: redis:latest
    volumes:
      - /home/mukhammad/backend/.redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: always
    networks:
      - backend


volumes:
  postgres_data:
  redis-data:

networks:
  backend:
    driver: bridge
