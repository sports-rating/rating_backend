[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.*
    Parser            docker
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name           modify
    Match          docker.*
    Add            source docker
    Add            container_name ${HOSTNAME}

[OUTPUT]
    Name           opentelemetry
    Match          docker.*
    Host           otel-collector
    Port           4318
